[project]
name = "micrort-api"
version = "1.0.0"
description = "MicroRT-Lab — FastAPI experiment-management, simulation and analysis layer"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.128",
    "uvicorn>=0.44",
    "pydantic>=2.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "httpx>=0.28",
    "ruff>=0.13",
]

# The service is executed in place (uvicorn app.main:app); no build/packaging.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
