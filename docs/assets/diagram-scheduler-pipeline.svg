<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <!-- MicroRT-Lab scheduler pipeline — original diagram, © 2026 Parsa Fathi (Apache-2.0) -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8271"/>
    </marker>
  </defs>
  <rect width="960" height="430" fill="#17140f"/>
  <text x="480" y="36" text-anchor="middle" fill="#ede8dd" font-size="20" letter-spacing="2">SCHEDULER PIPELINE — ONE DECISION POINT</text>
  <text x="480" y="54" text-anchor="middle" fill="#8a8271" font-size="11">the kernel queue always ranks (effective priority ↓, enqueue seq ↑); policies differ in ranking + preemption</text>

  <!-- candidates -->
  <g>
    <rect x="40" y="86" width="230" height="110" rx="8" fill="#201c15" stroke="#3a332a"/>
    <text x="64" y="110" fill="#f5b642" font-size="12" font-weight="bold">READY CANDIDATES</text>
    <g fill="#ede8dd" font-size="10">
      <text x="64" y="132">effective priority (base+aging+inherit)</text>
      <text x="64" y="148">enqueue seq (FIFO tie-break)</text>
      <text x="64" y="164">remaining CPU of current job</text>
      <text x="64" y="180">absolute deadline (EDF) · period (RM)</text>
    </g>
  </g>

  <line x1="270" y1="141" x2="318" y2="141" stroke="#8a8271" stroke-width="2" marker-end="url(#arr)"/>

  <!-- policy block -->
  <rect x="320" y="86" width="320" height="230" rx="8" fill="#26210f" stroke="#f5b642" stroke-dasharray="6 3"/>
  <text x="480" y="112" text-anchor="middle" fill="#f5b642" font-size="12" font-weight="bold">ISCHEDULER POLICY (8)</text>
  <g font-size="10" fill="#ede8dd">
    <text x="344" y="138">fifo       queue order, non-preemptive</text>
    <text x="344" y="156">rr         queue order + quantum, preemptive</text>
    <text x="344" y="174">priority   queue order (prio), non-preemptive</text>
    <text x="344" y="192">priority_p preemptive priority</text>
    <text x="344" y="210">sjf        remaining CPU ↑, non-preemptive</text>
    <text x="344" y="228">srtf       remaining CPU ↑, preemptive</text>
    <text x="344" y="246">rm         period ↑ (static), preemptive</text>
    <text x="344" y="264">edf        absolute deadline ↑, preemptive</text>
  </g>
  <text x="480" y="290" text-anchor="middle" fill="#8a8271" font-size="9">preemption switches ONLY on a strictly</text>
  <text x="480" y="304" text-anchor="middle" fill="#8a8271" font-size="9">more urgent candidate — no tie thrash</text>

  <!-- context switch -->
  <g>
    <rect x="680" y="86" width="240" height="110" rx="8" fill="#201c15" stroke="#3a332a"/>
    <text x="704" y="110" fill="#f5b642" font-size="12" font-weight="bold">DISPATCH</text>
    <g fill="#ede8dd" font-size="10">
      <text x="704" y="132">ctx switch cost (0..10 ticks)</text>
      <text x="704" y="148">gantt "ctx" zone + CONTEXT_SWITCH</text>
      <text x="704" y="164">quantum armed (rr)</text>
      <text x="704" y="180">reason: idle · preempt · rotate</text>
    </g>
  </g>

  <line x1="640" y1="141" x2="678" y2="141" stroke="#8a8271" stroke-width="2" marker-end="url(#arr)"/>

  <!-- running feedback -->
  <path d="M 800 196 L 800 250 L 480 250 L 480 316" fill="none" stroke="#8a8271" stroke-width="2" marker-end="url(#arr)"/>
  <text x="620" y="272" fill="#8a8271" font-size="10">running task state changes re-enter the decision point</text>

  <!-- preemption check -->
  <g>
    <rect x="320" y="318" width="320" height="76" rx="8" fill="#201c15" stroke="#e4574d"/>
    <text x="480" y="342" text-anchor="middle" fill="#e4574d" font-size="12" font-weight="bold">PREEMPTION CHECK</text>
    <g fill="#ede8dd" font-size="10" text-anchor="middle">
      <text x="480" y="360">arrival · unblock · quantum expiry · burst end</text>
      <text x="480" y="376">compare(running, best candidate) &lt; 0 → PREEMPT</text>
    </g>
  </g>

  <line x1="480" y1="316" x2="480" y2="230" stroke="#8a8271" stroke-width="2" marker-end="url(#arr)"/>
  <text x="480" y="415" text-anchor="middle" fill="#8a8271" font-size="9">Copyright © 2026 Parsa Fathi · Apache-2.0 · original diagram for MicroRT-Lab</text>
</svg>
