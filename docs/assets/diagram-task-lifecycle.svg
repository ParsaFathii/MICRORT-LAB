<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <!-- MicroRT-Lab task/event lifecycle — original diagram, © 2026 Parsa Fathi (Apache-2.0) -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8271"/>
    </marker>
  </defs>
  <rect width="980" height="460" fill="#17140f"/>
  <text x="490" y="34" text-anchor="middle" fill="#ede8dd" font-size="20" letter-spacing="2">TASK STATE LIFECYCLE</text>
  <text x="490" y="52" text-anchor="middle" fill="#8a8271" font-size="11">kernel-validated transitions — every edge emits trace events</text>

  <!-- ================= state nodes ================= -->
  <g font-size="12" text-anchor="middle" font-weight="bold">
    <rect x="60" y="90" width="170" height="54" rx="8" fill="#201c15" stroke="#57503f" stroke-dasharray="4 3"/>
    <text x="145" y="112" fill="#8a8271">TERMINATED</text>
    <text x="145" y="130" fill="#8a8271" font-size="9" font-weight="normal">job finished</text>

    <rect x="395" y="90" width="170" height="54" rx="8" fill="#201c15" stroke="#a8a29a"/>
    <text x="480" y="112" fill="#ede8dd">READY</text>
    <text x="480" y="130" fill="#8a8271" font-size="9" font-weight="normal">ready queue (prio &#8595; seq &#8593;)</text>

    <rect x="395" y="240" width="170" height="54" rx="8" fill="#26210f" stroke="#f5b642" stroke-width="2"/>
    <text x="480" y="262" fill="#f5b642">RUNNING</text>
    <text x="480" y="280" fill="#8a8271" font-size="9" font-weight="normal">on the CPU &#183; quantum &#183; bursts</text>

    <rect x="730" y="90" width="170" height="54" rx="8" fill="#201c15" stroke="#e4574d"/>
    <text x="815" y="112" fill="#e4574d">BLOCKED</text>
    <text x="815" y="130" fill="#8a8271" font-size="9" font-weight="normal">mutex &#183; sem &#183; msgq &#183; evflags</text>

    <rect x="730" y="240" width="170" height="54" rx="8" fill="#201c15" stroke="#a3c949"/>
    <text x="815" y="262" fill="#a3c949">WAITING</text>
    <text x="815" y="280" fill="#8a8271" font-size="9" font-weight="normal">I/O burst in flight</text>

    <rect x="730" y="390" width="170" height="54" rx="8" fill="#201c15" stroke="#45b3a4"/>
    <text x="815" y="412" fill="#45b3a4">SLEEPING</text>
    <text x="815" y="430" fill="#8a8271" font-size="9" font-weight="normal">explicit timed sleep</text>

    <rect x="60" y="390" width="170" height="54" rx="8" fill="#201c15" stroke="#57503f"/>
    <text x="145" y="412" fill="#8a8271">UNUSED</text>
    <text x="145" y="430" fill="#8a8271" font-size="9" font-weight="normal">registered, not yet released</text>
  </g>

  <!-- ================= edges + labels (dedicated lanes, no overlap) ================= -->
  <g stroke="#8a8271" stroke-width="1.6">

    <!-- UNUSED -> READY (release) -->
    <line x1="215" y1="400" x2="392" y2="140" marker-end="url(#arr)"/>

    <!-- READY -> RUNNING (dispatch) -->
    <line x1="480" y1="144" x2="480" y2="236" marker-end="url(#arr)"/>

    <!-- RUNNING -> READY (preempt/quantum) -->
    <line x1="455" y1="236" x2="455" y2="146" marker-end="url(#arr)"/>

    <!-- RUNNING -> BLOCKED (sync unsatisfied) -->
    <line x1="565" y1="258" x2="726" y2="130" marker-end="url(#arr)"/>

    <!-- RUNNING -> WAITING (io) -->
    <line x1="565" y1="267" x2="726" y2="262" marker-end="url(#arr)"/>

    <!-- RUNNING -> SLEEPING (sleep) -->
    <line x1="565" y1="288" x2="726" y2="398" marker-end="url(#arr)"/>

    <!-- BLOCKED -> READY (granted/wake) -->
    <line x1="726" y1="112" x2="567" y2="106" marker-end="url(#arr)"/>

    <!-- WAITING -> READY (io end) -->
    <line x1="726" y1="244" x2="567" y2="212" marker-end="url(#arr)"/>

    <!-- SLEEPING -> READY (timer) -->
    <line x1="726" y1="398" x2="567" y2="296" marker-end="url(#arr)"/>

    <!-- RUNNING -> TERMINATED (complete) -->
    <line x1="395" y1="272" x2="232" y2="130" marker-end="url(#arr)"/>

    <!-- TERMINATED -> READY (next periodic job) -->
    <line x1="230" y1="104" x2="392" y2="104" marker-end="url(#arr)"/>
  </g>

  <!-- label chips on clear lanes -->
  <g font-size="9.5" fill="#ede8dd">
    <g>
      <rect x="150" y="255" width="176" height="34" rx="5" fill="#201c15" stroke="#3a332a"/>
      <text x="238" y="268" text-anchor="middle">release &#8594; TASK_ARRIVAL</text>
      <text x="238" y="282" text-anchor="middle">/ JOB_RELEASE</text>
    </g>
    <g>
      <rect x="342" y="172" width="100" height="20" rx="5" fill="#201c15" stroke="#3a332a"/>
      <text x="392" y="186" text-anchor="middle">dispatch</text>
    </g>
    <g>
      <rect x="490" y="172" width="176" height="20" rx="5" fill="#201c15" stroke="#3a332a"/>
      <text x="578" y="186" text-anchor="middle">preempt &#183; QUANTUM_EXPIRE</text>
    </g>
    <g>
      <rect x="600" y="160" width="150" height="34" rx="5" fill="#201c15" stroke="#3a332a"/>
      <text x="675" y="173" text-anchor="middle">lock/wait/recv fail</text>
      <text x="675" y="187" text-anchor="middle">&#8594; LOCK_BLOCK &#183; SEM_WAIT</text>
    </g>
    <g>
      <rect x="600" y="236" width="96" height="20" rx="5" fill="#201c15" stroke="#3a332a"/>
      <text x="648" y="250" text-anchor="middle">io &#8594; IO_START</text>
    </g>
    <g>
      <rect x="600" y="330" width="104" height="20" rx="5" fill="#201c15" stroke="#3a332a"/>
      <text x="652" y="344" text-anchor="middle">sleep step</text>
    </g>
    <g>
      <rect x="580" y="86" width="146" height="20" rx="5" fill="#201c15" stroke="#3a332a"/>
      <text x="653" y="100" text-anchor="middle">wake &#8594; LOCK_RELEASE(h)</text>
    </g>
    <g>
      <rect x="576" y="196" width="106" height="20" rx="5" fill="#201c15" stroke="#3a332a"/>
      <text x="629" y="210" text-anchor="middle">io done &#8594; IO_END</text>
    </g>
    <g>
      <rect x="576" y="378" width="132" height="20" rx="5" fill="#201c15" stroke="#3a332a"/>
      <text x="642" y="392" text-anchor="middle">timer &#8594; SLEEP_END</text>
    </g>
    <g>
      <rect x="238" y="176" width="150" height="34" rx="5" fill="#201c15" stroke="#3a332a"/>
      <text x="313" y="189" text-anchor="middle">last step done</text>
      <text x="313" y="203" text-anchor="middle">&#8594; TASK_COMPLETE</text>
    </g>
    <g>
      <rect x="248" y="78" width="128" height="20" rx="5" fill="#201c15" stroke="#3a332a"/>
      <text x="312" y="92" text-anchor="middle">next periodic job</text>
    </g>
  </g>

  <text x="490" y="452" text-anchor="middle" fill="#8a8271" font-size="9">Copyright &#169; 2026 Parsa Fathi &#183; Apache-2.0 &#183; original diagram for MicroRT-Lab</text>
</svg>
