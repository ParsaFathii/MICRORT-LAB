<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <!-- MicroRT-Lab simulation flow — original diagram, © 2026 Parsa Fathi (Apache-2.0) -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8271"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="#17140f"/>
  <text x="480" y="36" text-anchor="middle" fill="#ede8dd" font-size="20" letter-spacing="2">DISCRETE-EVENT SIMULATION FLOW</text>
  <text x="480" y="54" text-anchor="middle" fill="#8a8271" font-size="11">time jumps event-to-event — never sleeps, never reads the wall clock</text>

  <!-- pipeline -->
  <g font-size="11">
    <rect x="40" y="90" width="180" height="70" rx="8" fill="#201c15" stroke="#3a332a"/>
    <text x="130" y="118" fill="#f5b642" text-anchor="middle" font-weight="bold">CONFIG JSON</text>
    <text x="130" y="136" fill="#8a8271" text-anchor="middle" font-size="10">micrort-config/1</text>
    <text x="130" y="150" fill="#8a8271" text-anchor="middle" font-size="10">validate → sha256 hash</text>

    <line x1="220" y1="125" x2="268" y2="125" stroke="#8a8271" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="270" y="90" width="200" height="70" rx="8" fill="#201c15" stroke="#3a332a"/>
    <text x="370" y="112" fill="#f5b642" text-anchor="middle" font-weight="bold">INITIALIZE</text>
    <text x="370" y="128" fill="#ede8dd" text-anchor="middle" font-size="10">kernel + resources</text>
    <text x="370" y="142" fill="#ede8dd" text-anchor="middle" font-size="10">release schedules</text>
    <text x="370" y="156" fill="#ede8dd" text-anchor="middle" font-size="10">ARM ARRIVAL EVENTS</text>

    <line x1="470" y1="125" x2="518" y2="125" stroke="#8a8271" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="520" y="80" width="400" height="90" rx="8" fill="#26210f" stroke="#f5b642" stroke-dasharray="6 3"/>
    <text x="720" y="104" fill="#f5b642" text-anchor="middle" font-weight="bold">EVENT LOOP — ONE ITERATION</text>
    <g fill="#ede8dd" font-size="10">
      <text x="540" y="124">t = min(event queue, timer list)</text>
      <text x="540" y="140">1. fire due timers (io/sleep/deadline/aging)</text>
      <text x="540" y="156">2. process arrivals + completions at t</text>
    </g>
    <g fill="#ede8dd" font-size="10">
      <text x="540" y="172">3. ONE scheduling decision: dispatch / preempt</text>
      <text x="540" y="188" fill="#8a8271">4. interpret next program steps → trace</text>
    </g>

    <line x1="720" y1="170" x2="720" y2="208" stroke="#8a8271" stroke-width="2" marker-end="url(#arr)"/>
    <text x="740" y="196" fill="#8a8271" font-size="10">loop while work remains</text>

    <rect x="400" y="210" width="300" height="56" rx="8" fill="#201c15" stroke="#3a332a"/>
    <text x="550" y="232" fill="#ede8dd" text-anchor="middle" font-size="10">record every state change:</text>
    <text x="550" y="248" fill="#f5b642" text-anchor="middle" font-weight="bold">TRACE · GANTT · METRICS</text>

    <line x1="400" y1="238" x2="352" y2="238" stroke="#8a8271" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="40" y="200" width="310" height="76" rx="8" fill="#201c15" stroke="#3a332a"/>
    <text x="195" y="226" fill="#f5b642" text-anchor="middle" font-weight="bold">TERMINATION</text>
    <text x="195" y="244" fill="#ede8dd" text-anchor="middle" font-size="10">horizon reached · queue+timers empty</text>
    <text x="195" y="260" fill="#ede8dd" text-anchor="middle" font-size="10">deadlocked tasks hold state to horizon</text>
    <text x="195" y="272" fill="#8a8271" text-anchor="middle" font-size="9">status: completed | stopped</text>

    <line x1="195" y1="276" x2="195" y2="314" stroke="#8a8271" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="40" y="316" width="880" height="70" rx="8" fill="#201c15" stroke="#57503f"/>
    <text x="64" y="342" fill="#f5b642" font-weight="bold">RESULT DOCUMENT — micrort-result/1</text>
    <g fill="#ede8dd" font-size="10">
      <text x="64" y="362">tasks[] · metrics{} · trace[] (seq, t, type, task, res, detail) · gantt[] (task, t0, t1, state)</text>
      <text x="64" y="378">resources[] · deadlocks[] (cycle) · memory (events, finalLayout, fragSeries) · anomalies[] · schedulerNotes[]</text>
    </g>
  </g>
</svg>
